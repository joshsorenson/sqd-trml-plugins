# Local preview config for `trmnlp serve`. Not uploaded to TRMNL.
# The sample data below stands in for /api/linear-issues so the
# layouts render without a Linear key. Delete `variables` and set
# LINEAR_API_KEY in your shell to preview against your real issues.
---
watch:
  - .trmnlp.yml
  - src

custom_fields:
  linear_api_key: "{{ env.LINEAR_API_KEY }}"
  max_issues: 11

variables:
  trmnl:
    plugin_settings:
      instance_name: Linear
  total_count: 15
  current_count: 12
  past_count: 3
  urgent_count: 2
  in_progress_count: 3
  current_cycle: 42
  user_name: Sample User
